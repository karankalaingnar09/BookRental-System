<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookRental - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-brand">
                <i class="fas fa-book-open"></i>
                <h1>BookRental</h1>
                <p>Your gateway to endless stories</p>
            </div>
            <div class="auth-features">
                <div class="feature-item">
                    <i class="fas fa-book"></i>
                    <span>Thousands of Books Available</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-bolt"></i>
                    <span>Fast &amp; Easy Rental</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>Secure &amp; Trusted</span>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
                    <button class="tab-btn" onclick="showTab('register')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-tab" class="tab-content active">
                    <h2>Welcome Back</h2>
                    <p class="auth-subtitle">Sign in to your account</p>
                    <div id="login-alert" class="alert hidden"></div>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Username</label>
                            <input type="text" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <div class="input-with-icon">
                                <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword', this)"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary btn-full" id="loginBtn">
                            <span>Sign In</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>
                    <p class="auth-footer">Don't have an account? <a href="#" onclick="showTab('register')">Sign Up</a></p>
                    <div class="auth-hint">
                        <i class="fas fa-info-circle"></i>
                        Default admin: <strong>admin</strong> / <strong>admin123</strong>
                    </div>
                </div>

                <!-- Register Form -->
                <div id="register-tab" class="tab-content">
                    <h2>Create Account</h2>
                    <p class="auth-subtitle">Join our reading community</p>
                    <div id="register-alert" class="alert hidden"></div>
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label><i class="fas fa-id-card"></i> Full Name</label>
                                <input type="text" id="regFullName" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label><i class="fas fa-user"></i> Username</label>
                                <input type="text" id="regUsername" placeholder="Min 3 characters" required minlength="3">
                            </div>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email</label>
                            <input type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Phone <span style="color:var(--gray);font-weight:400">(Optional)</span></label>
                            <input type="tel" id="regPhone" placeholder="+1 234 567 8900">
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-lock"></i> Password</label>
                            <div class="input-with-icon">
                                <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
                                <i class="fas fa-eye toggle-password" onclick="togglePassword('regPassword', this)"></i>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary btn-full" id="registerBtn">
                            <span>Create Account</span>
                            <i class="fas fa-user-plus"></i>
                        </button>
                    </form>
                    <p class="auth-footer">Already have an account? <a href="#" onclick="showTab('login')">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
