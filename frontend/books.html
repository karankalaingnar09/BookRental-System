<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookRental - Browse Books</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-book-open"></i>
            <span>BookRental</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i><span>Dashboard</span>
            </a>
            <a href="books.html" class="nav-item active">
                <i class="fas fa-book-open"></i><span>Browse Books</span>
            </a>
            <a href="my-rentals.html" class="nav-item">
                <i class="fas fa-bookmark"></i><span>My Rentals</span>
            </a>
            <a href="admin.html" class="nav-item admin-only hidden">
                <i class="fas fa-cog"></i><span>Admin Panel</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="sidebarUser"></div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Browse Books</h1>
        </header>

        <div class="content-area">
            <div class="search-bar-container">
                <div class="search-input-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by title, author, or genre..." oninput="debounceSearch(this.value)">
                </div>
                <div class="filter-group">
                    <select id="genreFilter" onchange="filterByGenre(this.value)">
                        <option value="">All Genres</option>
                    </select>
                    <select id="availFilter" onchange="filterAvailability(this.value)">
                        <option value="all">All Books</option>
                        <option value="available">Available Only</option>
                    </select>
                </div>
            </div>

            <div class="books-grid" id="booksGrid">
                <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        </div>
    </main>

    <!-- Rent Modal -->
    <div class="modal-overlay hidden" id="rentModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-bookmark"></i> Rent Book</h3>
                <button onclick="closeModal()" class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div id="rentBookInfo"></div>
                <div class="form-group">
                    <label>Rental Duration (Days)</label>
                    <input type="number" id="rentalDays" min="1" max="90" value="7" class="form-control" oninput="updateCostPreview()">
                </div>
                <div class="cost-preview">
                    <span>Estimated Cost:</span>
                    <strong id="estimatedCost">$0.00</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="confirmRentBtn" onclick="confirmRent()">
                    <i class="fas fa-check"></i> Confirm Rental
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/books.js"></script>
</body>
</html>
