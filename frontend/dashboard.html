<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookRental - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-book-open"></i>
            <span>BookRental</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="fas fa-home"></i><span>Dashboard</span>
            </a>
            <a href="books.html" class="nav-item">
                <i class="fas fa-book-open"></i><span>Browse Books</span>
            </a>
            <a href="my-rentals.html" class="nav-item">
                <i class="fas fa-bookmark"></i><span>My Rentals</span>
            </a>
            <a href="admin.html" class="nav-item admin-only hidden">
                <i class="fas fa-cog"></i><span>Admin Panel</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info" id="sidebarUser"></div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1 class="page-title">Dashboard</h1>
            <div class="top-bar-right">
                <span id="welcomeMsg" style="color:var(--gray);font-size:14px"></span>
            </div>
        </header>

        <div class="content-area">
            <div class="stats-grid">
                <div class="stat-card stat-blue">
                    <div class="stat-icon"><i class="fas fa-book-open"></i></div>
                    <div class="stat-info">
                        <h3 id="totalBooks">—</h3>
                        <p>Total Books</p>
                    </div>
                </div>
                <div class="stat-card stat-green">
                    <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-info">
                        <h3 id="availableBooks">—</h3>
                        <p>Available Now</p>
                    </div>
                </div>
                <div class="stat-card stat-orange">
                    <div class="stat-icon"><i class="fas fa-bookmark"></i></div>
                    <div class="stat-info">
                        <h3 id="myActiveRentals">—</h3>
                        <p>My Active Rentals</p>
                    </div>
                </div>
                <div class="stat-card stat-red">
                    <div class="stat-icon"><i class="fas fa-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="overdueRentals">—</h3>
                        <p>Overdue</p>
                    </div>
                </div>
            </div>

            <section class="section">
                <div class="section-header">
                    <h2>Featured Books</h2>
                    <a href="books.html" class="btn-link">View All <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="books-grid" id="featuredBooks">
                    <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Recent Rentals</h2>
                    <a href="my-rentals.html" class="btn-link">View All <i class="fas fa-arrow-right"></i></a>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Book</th>
                                <th>Rental Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Cost</th>
                            </tr>
                        </thead>
                        <tbody id="recentRentalsTable">
                            <tr><td colspan="5" class="text-center"><i class="fas fa-spinner fa-spin"></i></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Rent Modal -->
    <div class="modal-overlay hidden" id="rentModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-bookmark"></i> Rent Book</h3>
                <button onclick="closeModal()" class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div id="rentBookInfo"></div>
                <div class="form-group">
                    <label>Rental Duration (Days)</label>
                    <input type="number" id="rentalDays" min="1" max="90" value="7" class="form-control" oninput="updateCostPreview()">
                </div>
                <div class="cost-preview">
                    <span>Estimated Cost:</span>
                    <strong id="estimatedCost">$0.00</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="confirmRentBtn" onclick="confirmRent()">
                    <i class="fas fa-check"></i> Confirm Rental
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
